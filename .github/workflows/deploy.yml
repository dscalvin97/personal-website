name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-personal-website
  cancel-in-progress: true

env:
  NEXT_PUBLIC_UMAMI_SCRIPT_URL: https://umami.makes.fyi/script.js
  NEXT_PUBLIC_UMAMI_WEBSITE_ID: 42543dd5-f91a-44d9-9ba8-80a4e96bedb5

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package build
        run: tar -czf /tmp/personal-website-deploy.tar.gz -C out .

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload build
        run: |
          scp -o BatchMode=yes /tmp/personal-website-deploy.tar.gz \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/personal-website-deploy.tar.gz"

      - name: Deploy on server
        run: |
          ssh -o BatchMode=yes "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'rm -rf /tmp/personal-website-deploy && mkdir -p /tmp/personal-website-deploy && tar -xzf /tmp/personal-website-deploy.tar.gz -C /tmp/personal-website-deploy && sudo /usr/local/bin/deploy-personal-website /tmp/personal-website-deploy'
