backend:
  name: github
  repo: dscalvin97/personal-website
  branch: main
  base_url: https://calvin.makes.fyi
  auth_endpoint: admin/oauth/authorize

site_url: https://calvin.makes.fyi/
display_url: https://calvin.makes.fyi
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: content
    label: Site content
    description: Profile, skills, highlights, and site meta — one form, no extra clicks.
    files:
      - file: content/site-content.json
        name: content
        label: Profile, skills & highlights
        fields:
          - label: Profile
            name: profile
            widget: object
            collapsed: false
            fields:
              - { label: Full name, name: name, widget: string, required: true }
              - { label: Location, name: location, widget: string }
              - { label: Email, name: email, widget: string, required: true }
              - { label: Phone, name: phone, widget: string, required: false }
              - { label: Headline, name: headline, widget: text }
              - { label: Summary, name: summary, widget: text }
              - label: Links
                name: links
                widget: object
                collapsed: false
                fields:
                  - { label: LinkedIn, name: linkedin, widget: string }
                  - { label: GitHub, name: github, widget: string }
                  - { label: Gumroad, name: gumroad, widget: string }
                  - { label: Website, name: website, widget: string }
              - { label: Resume PDF path, name: resumePdf, widget: string, required: true, hint: "File in public/, e.g. /calvin-dsouza-resume.pdf" }

          - label: Skills
            name: skills
            widget: object
            collapsed: false
            fields:
              - { label: Languages, name: languages, widget: text }
              - { label: Web, name: web, widget: text }
              - { label: Data & CMS, name: data, widget: text }
              - { label: Cloud, name: cloud, widget: text }
              - { label: Creative / 3D, name: creative, widget: text }
              - { label: Also, name: also, widget: text, required: false }

          - label: Achievements
            name: achievements
            widget: object
            collapsed: false
            fields:
              - label: Highlights
                name: items
                widget: list
                summary: "{{fields.text}}"
                field: { label: Text, name: text, widget: text, required: true }

          - label: Site
            name: site
            widget: object
            collapsed: true
            fields:
              - { label: Updated at, name: updatedAt, widget: string, hint: "YYYY-MM-DD — bump when you publish" }
              - { label: Work page title, name: title, widget: string, required: false }

  - name: roles
    label: Roles
    label_singular: Role
    description: One file per job. Order 1 appears first on the work page.
    folder: content/roles
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{fields.slug}}"
    summary: "{{fields.company}} · order {{fields.order}}"
    sortable_fields: ["order", "company", "period"]
    fields:
      - { label: Slug, name: slug, widget: string, required: true, hint: "Filename (lowercase, hyphens). Example: kolors" }
      - { label: Order, name: order, widget: number, value_type: int, required: true, hint: "1 = first listed. Gaps (10, 20, 30) leave room to insert." }
      - { label: Company, name: company, widget: string, required: true }
      - { label: Company URL, name: href, widget: string, required: false }
      - { label: Job title, name: title, widget: string, required: true }
      - { label: Period, name: period, widget: string, hint: "Present  or  Jun 2025 – 2026" }
      - { label: Location, name: location, widget: string }
      - { label: Summary, name: summary, widget: text }
      - label: Highlights
        name: highlights
        widget: list
        summary: "{{fields.item}}"
        field: { label: Highlight, name: item, widget: text, required: true }
      - label: Tech
        name: tech
        widget: list
        required: false
        summary: "{{fields.item}}"
        field: { label: Tech, name: item, widget: string }
      - label: Tags
        name: tags
        widget: list
        required: false
        summary: "{{fields.item}}"
        field: { label: Tag, name: item, widget: string }

  - name: education
    label: Education
    label_singular: Entry
    folder: content/education
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{fields.slug}}"
    summary: "{{fields.credential}} · order {{fields.order}}"
    sortable_fields: ["order", "year"]
    fields:
      - { label: Slug, name: slug, widget: string, required: true }
      - { label: Order, name: order, widget: number, value_type: int, required: true }
      - { label: Credential, name: credential, widget: string, required: true }
      - { label: School, name: school, widget: string, required: true }
      - { label: Year, name: year, widget: string }
